# Shared defaults for PureForest 50 m tiles.
# coord.npy is metres / 25; data.scale puts the cloud back in metres so the
# voxel size and the camera match the other datasets. category.npy is one
# species id for the whole tile and is painted as segment.
extends: base.yaml

data:
  palettes: configs/palettes/pureforest.json
  palette_overrides: configs/palettes/pureforest_pred.json
  default_color: rgb
  scale: 25
  # ~0.12 m spacing once scaled back to metres. 0.18 m spheres were
  # picked from the radius sweep: crowns close, the ground stays dotted.
  voxel: 0.18
  center: true
  output_dir: null
  cache: false

render:
  engine: CYCLES
  n_samples: 64
  fast_gi: true
  ao_distance: 4.0
  ao_bounces: 1

sun:
  energy: 3.4
  color: [1.0, 1.0, 1.0]
  rotation_euler: [1.1693706, 0.0, 0.7853981852531433]
  angle: 2.5

world:
  color: [1.0, 1.0, 1.0]
  strength: 0.40

point_cloud:
  specularity: 0.05
  roughness: 0.4

void:
  color: [0.7686275, 0.7686275, 0.7686275]
  alpha: 0.55
