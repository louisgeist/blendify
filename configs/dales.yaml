# Shared defaults for DALES aerial tiles read as Pointcept scene folders.
# A figure config points data.path at <split>/<scene>/ (coord.npy, strength.npy,
# segment.npy, and pred.npy once a forward pass has written it).
extends: base.yaml

data:
  palettes: configs/palettes/dales.json
  # pred.npy uses the same class indices as segment.npy, so it inherits the
  # ground-truth colours. Absent until a forward pass writes the array.
  # The strength ramp itself lives in dales.json: it is the MALIBU3D
  # lidar-intensity ramp (cyan to gold, 64 stops, gamma 0.65).
  palette_overrides: configs/palettes/dales_pred.json
  default_color: strength
  # Class "Unknown" is unlabelled. Drop those points from every layer.
  drop_void: [segment]
  # ~0.16 m mean spacing at 40 pts/m². 0.4 m overlaps neighbours so a surface
  # reads solid. Scale by sqrt(n_full / n_kept) when subsampling.
  voxel: 0.4
  center: true
  # Full tile, not the 3x3 training chunks. Renders stay off the dataset tree.
  output_dir: null
  # coord.npy is already the fast form. Caching it again would only
  # duplicate the scene under data/.figcache.
  cache: false

render:
  engine: CYCLES
  n_samples: 64
  fast_gi: true
  ao_distance: 8.0
  ao_bounces: 1

sun:
  energy: 3.4
  color: [1.0, 1.0, 1.0]
  rotation_euler: [1.1693706, 0.0, 0.7853981852531433]
  angle: 2.5

world:
  color: [1.0, 1.0, 1.0]
  strength: 0.40

point_cloud:
  specularity: 0.05
  roughness: 0.4

void:
  color: [0.7686275, 0.7686275, 0.7686275]
  alpha: 0.55
