# Shared defaults for H3D (Hessigheim, March 2018) read as Pointcept folders.
# A figure config points data.path at <split>/<scene>/ (coord.npy, color.npy,
# segment.npy, and pred.npy once a forward pass has written it).
extends: base.yaml

data:
  palettes: configs/palettes/h3d.json
  palette_overrides: configs/palettes/h3d_pred.json
  default_color: rgb
  # Class "Void" is unlabelled. Drop those points from every layer.
  drop_void: [segment]
  # The test block is ~49M points at ~3 cm. One point per 15 cm voxel
  # brings it to ~4.0M before Blender. Sphere radius stays ~2.3× that
  # spacing so neighbours still overlap.
  grid_size: 0.15
  voxel: 0.35
  center: true
  output_dir: null
  cache: false

render:
  engine: CYCLES
  n_samples: 64
  fast_gi: true
  ao_distance: 4.0
  ao_bounces: 1

sun:
  energy: 3.4
  color: [1.0, 1.0, 1.0]
  rotation_euler: [1.1693706, 0.0, 0.7853981852531433]
  angle: 2.5

world:
  color: [1.0, 1.0, 1.0]
  strength: 0.40

point_cloud:
  specularity: 0.05
  roughness: 0.4

void:
  color: [0.7686275, 0.7686275, 0.7686275]
  alpha: 0.55
